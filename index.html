const VOLLEDIG = {
  1: ["Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,","(Hetwelk Hij te voren beloofd had door Zijn profeten, in de heilige Schriften).","Van Zijn Zoon, (Die geworden is uit het zaad van David, naar het vlees;","Die krachtelijk bewezen is te zijn de Zoon van God, naar den Geest der heiligmaking, uit de opstanding der doden) namelijk Jezus Christus, onzen Heere:","(Door Welken wij hebben ontvangen genade en het apostelschap, tot gehoorzaamheid des geloofs onder al de heidenen, voor Zijn Naam;","Onder welken gij ook zijt, geroepenen van Jezus Christus!)","Allen, die te Rome zijt, geliefden Gods, en geroepen heiligen, genade zij u, en vrede van God, onzen Vader, en den Heere Jezus Christus.","Eerstelijk dank ik mijn God door Jezus Christus over u allen, dat uw geloof verkondigd wordt in de gehele wereld.","Want God is mijn Getuige, Welken ik diene in mijn geest, in het Evangelie Zijns Zoons, hoe ik zonder nalaten uwer gedenke;","Allen tijd in mijn gebeden biddende, of mogelijk mij nog te eniger tijd goede gelegenheid gegeven wierd, door den wil van God, om tot ulieden te komen.","Want ik verlang om u te zien, opdat ik u enige geestelijke gave mocht mededelen, ten einde gij versterkt zoudt worden;","Dat is, om mede vertroost te worden onder u, door het onderlinge geloof, zo het uwe als het mijne.","Doch ik wil niet, dat u onbekend zij, broeders, dat ik menigmaal voorgenomen heb tot u te komen (en ben tot nog toe verhinderd geweest), opdat ik ook onder u enige vrucht zou hebben, gelijk als ook onder de andere heidenen.","Beiden Grieken en Barbaren, beiden wijzen en onwijzen ben ik een schuldenaar.","Alzo hetgeen in mij is, dat is volvaardig, om u ook, die te Rome zijt, het Evangelie te verkondigen.","Want ik schaam mij des Evangelies van Christus niet; want het is een kracht Gods tot zaligheid een iegelijk, die gelooft, eerst den Jood, en ook den Griek.","Want de rechtvaardigheid Gods wordt in hetzelve geopenbaard uit geloof tot geloof; gelijk geschreven is: Maar de rechtvaardige zal uit het geloof leven.","Want de toorn Gods wordt geopenbaard van den hemel over alle goddeloosheid, en ongerechtigheid der mensen, als die de waarheid in ongerechtigheid ten onder houden.","Overmits hetgeen van God kennelijk is, in hen openbaar is; want God heeft het hun geopenbaard.","Want Zijn onzienlijke dingen worden, van de schepping der wereld aan, uit de schepselen verstaan en doorzien, beide Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.","Omdat zij, God kennende, Hem als God niet hebben verheerlijkt of gedankt; maar zijn verijdeld geworden in hun overleggingen en hun onverstandig hart is verduisterd geworden;","Zich uitgevende voor wijzen, zijn zij dwaas geworden;","En hebben de heerlijkheid des onverderfelijken Gods veranderd in de gelijkenis eens beelds van een verderfelijk mens, en van gevogelte, en van viervoetige en kruipende gedierten.","Daarom heeft God hen ook overgegeven in de begeerlijkheden hunner harten tot onreinigheid, om hun lichamen onder elkander te onteren;","Als die de waarheid Gods veranderd hebben in de leugen, en het schepsel geëerd en gediend hebben boven den Schepper, Die te prijzen is in der eeuwigheid, amen.","Daarom heeft God hen overgegeven tot oneerlijke bewegingen; want ook hun vrouwen hebben het natuurlijk gebruik veranderd in het gebruik tegen nature;","En insgelijks ook de mannen, nalatende het natuurlijk gebruik der vrouw, zijn verhit geworden in hun lust tegen elkander, mannen met mannen schandelijkheid bedrijvende, en de vergelding van hun dwaling, die daartoe behoorde, in zichzelven ontvangende.","En gelijk het hun niet goed gedacht heeft God in erkentenis te houden, zo heeft God hen overgegeven in een verkeerden zin, om te doen dingen, die niet betamen;","Vervuld zijnde met alle ongerechtigheid, hoererij, boosheid, gierigheid, kwaadheid, vol van nijdigheid, moord, twist, bedrog, kwaadaardigheid;","Oorblazers, achterklappers, haters Gods, smaders, hovaardigen, laatdunkenden, vinders van kwade dingen, den ouderen ongehoorzaam;","Onverstandigen, verbondbrekers, zonder natuurlijke liefde, onverzoenlijken, onbarmhartigen;","Dewelken, daar zij het recht Gods weten, (namelijk, dat degenen, die zulke dingen doen, des doods waardig zijn) niet alleen dezelve doen, maar ook mede een welgevallen hebben in degenen, die ze doen."],
  2: ["Daarom zijt gij niet te verontschuldigen, o mens, wie gij zijt, die anderen oordeelt; want waarin gij een ander oordeelt, veroordeelt gij uzelven; want gij, die anderen oordeelt, doet dezelfde dingen.","En wij weten, dat het oordeel Gods naar waarheid is, over degenen, die zulke dingen doen.","En denkt gij dit, o mens, die oordeelt dengenen, die zulke dingen doen, en dezelve doet, dat gij het oordeel Gods zult ontvlieden?","Of veracht gij den rijkdom Zijner goedertierenheid, en verdraagzaamheid, en lankmoedigheid, niet wetende, dat de goedertierenheid Gods u tot bekering leidt?","Maar naar uw hardigheid, en onbekeerlijk hart, vergadert gij uzelven toorn als een schat, in den dag des toorns, en der openbaring van het rechtvaardig oordeel Gods.","Welke een iegelijk vergelden zal naar zijn werken;","Dengenen wel, die met volharding in goeddoen, heerlijkheid, en eer, en onverderfelijkheid zoeken, het eeuwige leven;","Maar dengenen, die twistgierig zijn, en die der waarheid ongehoorzaam, doch der ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;","Verdrukking en benauwdheid over alle ziel des mensen, die het kwade werkt, eerst van den Jood, en ook van den Griek;","Maar heerlijkheid, en eer, en vrede een iegelijk, die het goede werkt, eerst den Jood, en ook den Griek.","Want er is geen aanneming des persoons bij God.","Want zovelen, als er zonder wet gezondigd hebben, zullen ook zonder wet verloren gaan; en zovelen, als er onder de wet gezondigd hebben, zullen door de wet geoordeeld worden;","(Want de hoorders der wet zijn niet rechtvaardig voor God, maar de daders der wet zullen gerechtvaardigd worden;","Want wanneer de heidenen, die de wet niet hebben, van nature de dingen doen, die der wet zijn, deze, de wet niet hebbende, zijn zichzelven een wet;","Als die betonen het werk der wet geschreven in hun harten, hun geweten medegetuigende, en de gedachten onder elkander hen beschuldigende, of ook ontschuldigende).","In den dag wanneer God de verborgene dingen der mensen zal oordelen door Jezus Christus, naar mijn Evangelie.","Zie, gij wordt een Jood genaamd en rust op de wet; en roemt op God,","En gij weet Zijn wil, en beproeft de dingen, die daarvan verschillen, zijnde onderwezen uit de wet;","En gij betrouwt uzelven te zijn een leidsman der blinden, een licht dergenen, die in duisternis zijn;","Een onderrichter der onwijzen, en een leermeester der onwetenden, hebbende de gedaante der kennis en der waarheid in de wet.","Die dan een anderen leert, leert gij uzelven niet? Die predikt, dat men niet stelen zal, steelt gij?","Die zegt, dat men geen overspel doen zal, doet gij overspel? Die van de afgoden een gruwel hebt, berooft gij het heilige?","Die op de wet roemt, onteert gij God door de overtreding der wet?","Want de Naam van God wordt om uwentwil gelasterd onder de heidenen, gelijk geschreven is.","Want de besnijdenis is wel nut, indien gij de wet doet; maar indien gij een overtreder der wet zijt, zo is uw besnijdenis voorhuid geworden.","Indien dan de voorhuid de rechten der wet bewaart, zal niet zijn voorhuid tot een besnijdenis gerekend worden?","En zal de voorhuid, die uit de natuur is, als zij de wet volbrengt, u niet oordelen, die door de letter en besnijdenis een overtreder der wet zijt?","Want die is niet een Jood, die het in het openbaar is; noch die is de besnijdenis, die het in het openbaar in het vlees is;","Maar die is een Jood, die het in het verborgen is, en de besnijdenis des harten, in den geest, niet in de letter, is de besnijdenis; wiens lof niet is uit de mensen, maar uit God."],
  3: ["Welk is dan het voordeel van den Jood? Of welk is de nuttigheid der besnijdenis?","Vele in alle manier; want dit is wel het eerste, dat hun de Woorden Gods zijn toebetrouwd.","Want wat is het, al zijn sommigen ongelovig geweest? Zal hun ongelovigheid het geloof van God te niet doen?","Dat zij verre. Doch God zij waarachtig, maar alle mens leugenachtig; gelijk als geschreven is: Opdat Gij gerechtvaardigd wordt in Uw woorden, en overwint, wanneer Gij oordeelt.","Indien nu onze ongerechtigheid Gods gerechtigheid bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar den mens.)","Dat zij verre, anderszins hoe zal God de wereld oordelen?","Want indien de waarheid Gods door mijn leugen overvloediger is geworden, tot Zijn heerlijkheid, wat word ik ook nog als een zondaar geoordeeld?","En zeggen wij niet liever (gelijk wij gelasterd worden, en gelijk sommigen zeggen, dat wij zeggen): Laat ons het kwade doen, opdat het goede daaruit kome? Welker verdoemenis rechtvaardig is.","Wat dan? Zijn wij uitnemender? Ganselijk niet; want wij hebben te voren beschuldigd beiden Joden en Grieken, dat zij allen onder de zonde zijn;","Gelijk geschreven is: Er is niemand rechtvaardig, ook niet een;","Er is niemand, die verstandig is, er is niemand, die God zoekt.","Allen zijn zij afgeweken, te zamen zijn zij onnut geworden; er is niemand, die goed doet, er is ook niet tot een toe.","Hun keel is een geopend graf; met hun tongen plegen zij bedrog; slangenvenijn is onder hun lippen.","Welker mond vol is van vervloeking en bitterheid;","Hun voeten zijn snel om bloed te vergieten;","Vernieling en ellendigheid is in hun wegen;","En den weg des vredes hebben zij niet gekend.","Er is geen vreze Gods voor hun ogen.","Wij weten nu, dat al wat de wet zegt, zij dat spreekt tot degenen, die onder de wet zijn; opdat alle mond gestopt worde en de gehele wereld voor God verdoemelijk zij.","Daarom zal uit de werken der wet geen vlees gerechtvaardigd worden, voor Hem; want door de wet is de kennis der zonde.","Maar nu is de rechtvaardigheid Gods geopenbaard geworden zonder de wet, hebbende getuigenis van de wet en de profeten:","Namelijk de rechtvaardigheid Gods door het geloof van Jezus Christus, tot allen, en over allen, die geloven; want er is geen onderscheid.","Want zij hebben allen gezondigd, en derven de heerlijkheid Gods;","En worden om niet gerechtvaardigd, uit Zijn genade, door de verlossing, die in Christus Jezus is;","Welken God voorgesteld heeft tot een verzoening, door het geloof in Zijn bloed, tot een betoning van Zijn rechtvaardigheid, door de vergeving der zonden, die te voren geschied zijn onder de verdraagzaamheid Gods;","Tot een betoning van Zijn rechtvaardigheid in dezen tegenwoordigen tijd; opdat Hij rechtvaardig zij, en rechtvaardigende dengene, die uit het geloof van Jezus is.","Waar is dan de roem? Hij is uitgesloten. Door wat wet? Der werken? Neen, maar door de wet des geloofs.","Wij besluiten dan, dat de mens door het geloof gerechtvaardigd wordt, zonder de werken der wet.","Is God een God der Joden alleen? en is Hij het niet ook der heidenen? Ja, ook der heidenen;","Nademaal Hij een enig God is, Die de besnijdenis rechtvaardigen zal uit het geloof, en de voorhuid door het geloof.","Doen wij dan de wet te niet door het geloof? Dat zij verre; maar wij bevestigen de wet."],
  4: ["Wat zullen wij dan zeggen, dat Abraham, onze vader, verkregen heeft naar het vlees?","Want indien Abraham uit de werken gerechtvaardigd is, zo heeft hij roem, maar niet bij God.","Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.","Nu dengene, die werkt, wordt het loon niet toegerekend naar genade, maar naar schuld.","Doch dengene, die niet werkt, maar gelooft in Hem, Die den goddeloze rechtvaardigt, wordt zijn geloof gerekend tot rechtvaardigheid.","Gelijk ook David den mens zalig spreekt, welken God de rechtvaardigheid toerekent zonder werken;","Zeggende: Zalig zijn zij, welker ongerechtigheden vergeven zijn, en welker zonden bedekt zijn;","Zalig is de man, welken de Heere de zonden niet toerekent.","Deze zaligspreking dan, is die alleen over de besnijdenis, of ook over de voorhuid? Want wij zeggen, dat Abraham het geloof gerekend is tot rechtvaardigheid.","Hoe is het hem dan toegerekend? Als hij in de besnijdenis was, of in de voorhuid? Niet in de besnijdenis, maar in de voorhuid.","En hij heeft het teken der besnijdenis ontvangen tot een zegel der rechtvaardigheid des geloofs, die hem in de voorhuid was toegerekend: opdat hij zou zijn een vader van allen, die geloven in de voorhuid zijnde, ten einde ook hun de rechtvaardigheid toegerekend worde;","En een vader der besnijdenis, dengenen namelijk, die niet alleen uit de besnijdenis zijn, maar die ook wandelen in de voetstappen des geloofs van onzen vader Abraham, hetwelk in de voorhuid was.","Want de belofte is niet door de wet aan Abraham of zijn zaad geschied, namelijk, dat hij een erfgenaam der wereld zou zijn, maar door de rechtvaardigheid des geloofs.","Want indien degenen, die uit de wet zijn, erfgenamen zijn, zo is het geloof ijdel geworden, en de beloftenis te niet gedaan.","Want de wet werkt toorn; want waar geen wet is, daar is ook geen overtreding.","Daarom is zij uit het geloof, opdat zij naar genade zij; ten einde de belofte vast zij al den zade, niet alleen dat uit de wet is, maar ook dat uit het geloof Abrahams is, welke een vader is van ons allen;","(Gelijk geschreven staat: Ik heb u tot een vader van vele volken gesteld) voor Hem, aan Welken hij geloofd heeft, namelijk God, Die de doden levend maakt, en roept de dingen, die niet zijn, alsof zij waren;","Welke tegen hoop op hoop geloofd heeft, dat hij zou worden een vader van vele volken; volgens hetgeen gezegd was: Alzo zal uw zaad wezen.","En niet verzwakt zijnde in het geloof, heeft hij zijn eigen lichaam niet aangemerkt, dat alrede verstorven was, alzo hij omtrent honderd jaren oud was, noch ook dat de moeder in Sara verstorven was.","En hij heeft aan de beloftenis Gods niet getwijfeld door ongeloof; maar is gesterkt geweest in het geloof, gevende God de eer;","En ten volle verzekerd zijnde, dat hetgeen beloofd was, Hij ook machtig was te doen.","Daarom is het hem ook tot rechtvaardigheid gerekend.","Nu is het niet alleen om zijnentwil geschreven, dat het hem toegerekend is;","Maar ook om onzentwil, welken het zal toegerekend worden, namelijk dengenen, die geloven in Hem, Die Jezus, onzen Heere, uit de doden opgewekt heeft;","Welke overgeleverd is om onze zonden, en opgewekt om onze rechtvaardigmaking."],
  5: ["Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onzen Heere Jezus Christus;","Door Welken wij ook de toeleiding hebben door het geloof tot deze genade, in welke wij staan, en roemen in de hoop der heerlijkheid Gods.","En niet alleenlijk dit, maar wij roemen ook in de verdrukkingen, wetende, dat de verdrukking lijdzaamheid werkt;","En de lijdzaamheid bevinding, en de bevinding hoop;","En de hoop beschaamt niet, omdat de liefde Gods in onze harten uitgestort is door den Heiligen Geest, Die ons is gegeven.","Want Christus, als wij nog krachteloos waren, is te Zijner tijd voor de goddelozen gestorven.","Want nauwelijks zal iemand voor een rechtvaardige sterven; want voor den goede zal mogelijk iemand ook bestaan te sterven.","Maar God bevestigt Zijn liefde jegens ons, dat Christus voor ons gestorven is, als wij nog zondaars waren.","Veel meer dan, zijnde nu gerechtvaardigd door Zijn bloed, zullen wij door Hem behouden worden van den toorn.","Want indien wij, vijanden zijnde, met God verzoend zijn door den dood Zijns Zoons, veel meer zullen wij, verzoend zijnde, behouden worden door Zijn leven.","En niet alleenlijk dit, maar wij roemen ook in God, door onzen Heere Jezus Christus, door Welken wij nu de verzoening gekregen hebben.","Daarom, gelijk door een mens de zonde in de wereld ingekomen is, en door de zonde de dood; en alzo de dood tot alle mensen doorgegaan is, in welken allen gezondigd hebben.","Want tot de wet was de zonde in de wereld; maar de zonde wordt niet toegerekend, als er geen wet is.","Maar de dood heeft geheerst van Adam tot Mozes toe, ook over degenen, die niet gezondigd hadden in de gelijkheid der overtreding van Adam, welke een voorbeeld is Desgenen, Die komen zou.","Doch niet, gelijk de misdaad, alzo is ook de genadegift, want indien, door de misdaad van een, velen gestorven zijn, zo is veel meer de genade Gods, en de gave door de genade, die daar is van een mens Jezus Christus, overvloedig geweest over velen.","En niet, gelijk de schuld was door den een, die gezondigd heeft, alzo is de gift; want de schuld is wel uit een misdaad tot verdoemenis, maar de genadegift is uit vele misdaden tot rechtvaardigmaking.","Want indien door de misdaad van een de dood geheerst heeft door dien enen, veel meer zullen degenen, die den overvloed der genade en der gave der rechtvaardigheid ontvangen, in het leven heersen door dien Enen, namelijk Jezus Christus.","Zo dan, gelijk door een misdaad de schuld gekomen is over alle mensen tot verdoemenis; alzo ook door een rechtvaardigheid komt de genade over alle mensen tot rechtvaardigmaking des levens.","Want gelijk door de ongehoorzaamheid van dien enen mens velen tot zondaars gesteld zijn geworden, alzo zullen ook door de gehoorzaamheid van Enen velen tot rechtvaardigen gesteld worden.","Maar de wet is bovendien ingekomen, opdat de misdaad te meerder worde; en waar de zonde meerder geworden is, daar is de genade veel meer overvloedig geweest;","Opdat, gelijk de zonde geheerst heeft tot den dood, alzo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onzen Heere."],
  6: ["Wat zullen wij dan zeggen? Zullen wij in de zonde blijven, opdat de genade te meerder worde?","Dat zij verre. Wij, die der zonde gestorven zijn, hoe zullen wij nog in dezelve leven?","Of weet gij niet, dat zovelen als wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn?","Wij zijn dan met Hem begraven, door den doop in den dood, opdat, gelijkerwijs Christus uit de doden opgewekt is tot de heerlijkheid des Vaders, alzo ook wij in nieuwigheid des levens wandelen zouden.","Want indien wij met Hem een plant geworden zijn in de gelijkmaking Zijns doods, zo zullen wij het ook zijn in de gelijkmaking Zijner opstanding;","Dit wetende, dat onze oude mens met Hem gekruisigd is, opdat het lichaam der zonde te niet gedaan worde, opdat wij niet meer de zonde dienen.","Want die gestorven is, die is gerechtvaardigd van de zonde.","Indien wij nu met Christus gestorven zijn, zo geloven wij, dat wij ook met Hem zullen leven;","Wetende, dat Christus, opgewekt zijnde uit de doden, niet meer sterft; de dood heerst niet meer over Hem.","Want dat Hij gestorven is, dat is Hij der zonde eenmaal gestorven; en dat Hij leeft, dat leeft Hij Gode.","Alzo ook gijlieden, houdt het daarvoor dat gij wel der zonde dood zijt, maar Gode levende zijt in Christus Jezus, onzen Heere.","Dat dan de zonde niet heerse in uw sterfelijk lichaam, om haar te gehoorzamen in de begeerlijkheden deszelven lichaams.","En stelt uwe leden niet der zonde tot wapenen der ongerechtigheid; maar stelt uzelven Gode, als uit de doden levende geworden zijnde, en stelt uw leden Gode tot wapenen der gerechtigheid.","Want de zonde zal over u niet heersen; want gij zijt niet onder de wet, maar onder de genade.","Wat dan? Zullen wij zondigen, omdat wij niet zijn onder de wet, maar onder de genade? Dat zij verre.","Weet gij niet, dat wien gij uzelven stelt tot dienstknechten ter gehoorzaamheid, gij dienstknechten zijt desgenen, dien gij gehoorzaamt, of der zonde tot den dood, of der gehoorzaamheid tot gerechtigheid?","Maar Gode zij dank, dat gij wel dienstknechten der zonde waart, maar dat gij nu van harte gehoorzaam geworden zijt aan het voorbeeld der leer, tot hetwelk gij overgegeven zijt;","En vrijgemaakt zijnde van de zonde, zijt gemaakt dienstknechten der gerechtigheid.","Ik spreek op menselijke wijze, om der zwakheid uws vleses wil; want gelijk gij uw leden gesteld hebt, om dienstbaar te zijn der onreinigheid en der ongerechtigheid, tot ongerechtigheid, alzo stelt nu uw leden, om dienstbaar te zijn der gerechtigheid, tot heiligmaking.","Want toen gij dienstknechten waart der zonde, zo waart gij vrij van de gerechtigheid.","Wat vrucht dan hadt gij toen van die dingen, waarover gij u nu schaamt? Want het einde derzelve is de dood.","Maar nu, van de zonde vrijgemaakt zijnde, en Gode dienstbaar gemaakt zijnde, hebt gij uw vrucht tot heiligmaking, en het einde het eeuwige leven.","Want de bezoldiging der zonde is de dood, maar de genadegift Gods is het eeuwige leven, door Jezus Christus, onzen Heere."],
  7: ["Weet gij niet, broeders! (want ik spreek tot degenen, die de wet verstaan) dat de wet heerst over den mens, zo langen tijd als hij leeft?","Want een vrouw, die onder den man staat, is aan den levenden man verbonden door de wet; maar indien de man gestorven is, zo is zij vrijgemaakt van de wet des mans.","Daarom dan, indien zij eens anderen mans wordt, terwijl de man leeft, zo zal zij een overspeelster genaamd worden; maar indien de man gestorven is, zo is zij vrij van de wet, alzo dat zij geen overspeelster is, als zij eens anderen mans wordt.","Zo dan, mijn broeders, gij zijt ook der wet gedood door het lichaam van Christus, opdat gij zoudt worden eens Anderen, namelijk Desgenen, Die van de doden opgewekt is, opdat wij Gode vruchten dragen zouden.","Want toen wij in het vlees waren, wrochten de bewegingen der zonden, die door de wet zijn, in onze leden, om den dood vruchten te dragen.","Maar nu zijn wij vrijgemaakt van de wet, overmits wij dien gestorven zijn, onder welken wij gehouden waren; alzo dat wij dienen in nieuwigheid des geestes, en niet in de oudheid der letter.","Wat zullen wij dan zeggen? Is de wet zonde? Dat zij verre. Ja, ik kende de zonde niet dan door de wet; want ook had ik de begeerlijkheid niet geweten zonde te zijn, indien de wet niet zeide: Gij zult niet begeren.","Maar de zonde, oorzaak genomen hebbende door het gebod, heeft in mij alle begeerlijkheid gewrocht; want zonder de wet is de zonde dood.","En zonder de wet, zo leefde ik eertijds; maar als het gebod gekomen is, zo is de zonde weder levend geworden, doch ik ben gestorven.","En het gebod, dat ten leven was, hetzelve is mij ten dood bevonden.","Want de zonde, oorzaak genomen hebbende door het gebod, heeft mij verleid, en door hetzelve gedood.","Alzo is dan de wet heilig, en het gebod is heilig, en rechtvaardig, en goed.","Is dan het goede mij de dood geworden? Dat zij verre. Maar de zonde is mij de dood geworden; opdat zij zou openbaar worden zonde te zijn; werkende mij door het goede den dood; opdat de zonde boven mate wierd zondigende door het gebod.","Want wij weten, dat de wet geestelijk is, maar ik ben vleselijk, verkocht onder de zonde.","Want hetgeen ik doe, dat ken ik niet; want hetgeen ik wil, dat doe ik niet, maar hetgeen ik haat, dat doe ik.","En indien ik hetgene doe, dat ik niet wil, zo stem ik de wet toe, dat zij goed is.","Ik dan doe datzelve nu niet meer, maar de zonde, die in mij woont.","Want ik weet, dat in mij, dat is, in mijn vlees, geen goed woont; want het willen is wel bij mij, maar het goede te doen, dat vind ik niet.","Want het goede dat ik wil, doe ik niet, maar het kwade, dat ik niet wil, dat doe ik.","Indien ik hetgene doe, dat ik niet wil, zo doe ik nu hetzelve niet meer, maar de zonde, die in mij woont.","Zo vind ik dan deze wet in mij; als ik het goede wil doen, dat het kwade mij bijligt.","Want ik heb een vermaak in de wet Gods, naar den inwendigen mens;","Maar ik zie een andere wet in mijn leden, welke strijdt tegen de wet mijns gemoeds, en mij gevangen neemt onder de wet der zonde, die in mijn leden is.","Ik ellendig mens, wie zal mij verlossen uit het lichaam dezes doods?","Ik dank God, door Jezus Christus, onzen Heere.","Zo dan, ik zelf dien wel met het gemoed de wet Gods, maar met het vlees de wet der zonde."],
  8: ["Zo is er dan nu geen verdoemenis voor degenen, die in Christus Jezus zijn, die niet naar het vlees wandelen, maar naar den Geest.","Want de wet des Geestes des levens in Christus Jezus heeft mij vrijgemaakt van de wet der zonde en des doods.","Want hetgeen der wet onmogelijk was, dewijl zij door het vlees krachteloos was, heeft God, Zijn Zoon zendende in gelijkheid des zondigen vleses, en dat voor de zonde, de zonde veroordeeld in het vlees.","Opdat het recht der wet vervuld zou worden in ons, die niet naar het vlees wandelen, maar naar den Geest.","Want die naar het vlees zijn, bedenken, dat des vleses is; maar die naar den Geest zijn, bedenken, dat des Geestes is.","Want het bedenken des vleses is de dood; maar het bedenken des Geestes is het leven en vrede;","Daarom dat het bedenken des vleses vijandschap is tegen God; want het onderwerpt zich der wet Gods niet; want het kan ook niet.","En die in het vlees zijn, kunnen Gode niet behagen.","Doch gijlieden zijt niet in het vlees, maar in den Geest, zo anders de Geest Gods in u woont. Maar zo iemand den Geest van Christus niet heeft, die komt Hem niet toe.","En indien Christus in ulieden is, zo is wel het lichaam dood om der zonden wil; maar de geest is leven om der gerechtigheid wil.","En indien de Geest Desgenen, Die Jezus uit de doden opgewekt heeft, in u woont, zo zal Hij, Die Christus uit de doden opgewekt heeft, ook uw sterfelijke lichamen levend maken, door Zijn Geest, Die in u woont.","Zo dan, broeders, wij zijn schuldenaars niet aan het vlees, om naar het vlees te leven.","Want indien gij naar het vlees leeft, zo zult gij sterven; maar indien gij door den Geest de werkingen des lichaams doodt, zo zult gij leven.","Want zovelen als er door den Geest Gods geleid worden, die zijn kinderen Gods.","Want gij hebt niet ontvangen den Geest der dienstbaarheid wederom tot vreze; maar gij hebt ontvangen den Geest der aanneming tot kinderen, door Welken wij roepen: Abba, Vader!","Dezelve Geest getuigt met onzen geest, dat wij kinderen Gods zijn.","En indien wij kinderen zijn, zo zijn wij ook erfgenamen, erfgenamen van God, en mede-erfgenamen van Christus; zo wij anders met Hem lijden, opdat wij ook met Hem verheerlijkt worden.","Want ik houde het daarvoor, dat het lijden dezes tegenwoordigen tijds niet is te waarderen tegen de heerlijkheid, die aan ons zal geopenbaard worden.","Want het schepsel, als met opgestoken hoofde, verwacht de openbaring der kinderen Gods.","Want het schepsel is der ijdelheid onderworpen, niet gewillig, maar om diens wil, die het der ijdelheid onderworpen heeft;","Op hoop, dat ook het schepsel zelf zal vrijgemaakt worden van de dienstbaarheid der verderfenis, tot de vrijheid der heerlijkheid der kinderen Gods.","Want wij weten, dat het ganse schepsel te zamen zucht, en te zamen als in barensnood is tot nu toe.","En niet alleen dit, maar ook wij zelven, die de eerstelingen des Geestes hebben, wij ook zelven, zeg ik, zuchten in onszelven, verwachtende de aanneming tot kinderen, namelijk de verlossing onzes lichaams.","Want wij zijn in hope zalig geworden. De hoop nu, die gezien wordt, is geen hoop; want hetgeen iemand ziet, waarom zal hij het ook hopen?","Maar indien wij hopen, hetgeen wij niet zien, zo verwachten wij het met lijdzaamheid.","En desgelijks komt ook de Geest onze zwakheden mede te hulp; want wij weten niet, wat wij bidden zullen, gelijk het behoort, maar de Geest Zelf bidt voor ons met onuitsprekelijke zuchtingen.","En Die de harten doorzoekt, weet, welke de mening des Geestes zij, dewijl Hij naar God voor de heiligen bidt.","En wij weten, dat dengenen, die God liefhebben, alle dingen medewerken ten goede, namelijk dengenen, die naar Zijn voornemen geroepen zijn.","Want die Hij te voren gekend heeft, die heeft Hij ook te voren verordineerd, den beelde Zijns Zoons gelijkvormig te zijn, opdat Hij de Eerstgeborene zij onder vele broederen.","En die Hij te voren verordineerd heeft, dezen heeft Hij ook geroepen; en die Hij geroepen heeft, dezen heeft Hij ook gerechtvaardigd; en die Hij gerechtvaardigd heeft, dezen heeft Hij ook verheerlijkt.","Wat zullen wij dan tot deze dingen zeggen? Zo God voor ons is, wie zal tegen ons zijn?","Die ook Zijn eigen Zoon niet gespaard heeft, maar heeft Hem voor ons allen overgegeven, hoe zal Hij ons ook met Hem niet alle dingen schenken?","Wie zal beschuldiging inbrengen tegen de uitverkorenen Gods? God is het, Die rechtvaardig maakt.","Wie is het, die verdoemt? Christus is het, Die gestorven is; ja, wat meer is, Die ook opgewekt is, Die ook ter rechterhand Gods is, Die ook voor ons bidt.","Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, naaktheid, of gevaar, of zwaard?","(Gelijk geschreven is: Want om Uwentwil worden wij den gansen dag gedood; wij zijn geacht als schapen ter slachting.)","Maar in dit alles zijn wij meer dan overwinnaars, door Hem, Die ons liefgehad heeft.","Want ik ben verzekerd, dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch tegenwoordige, noch toekomende dingen,","Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde Gods, welke is in Christus Jezus, onzen Heere."],
  9: ["Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten mij mede getuigenis gevende door den Heiligen Geest),","Dat het mij een grote droefheid, en mijn hart een gedurige smart is.","Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broederen, die mijn maagschap zijn naar het vlees;","Welke Israëlieten zijn, welker is de aanneming tot kinderen, en de heerlijkheid, en de verbonden, en de wetgeving, en de dienst van God, en de beloftenissen;","Welker zijn de vaders, en uit welke Christus is, zoveel het vlees aangaat, Dewelke is God boven allen te prijzen in der eeuwigheid. Amen.","Doch ik zeg dit niet, alsof het woord Gods ware uitgevallen; want die zijn niet allen Israël, die uit Israël zijn.","Noch omdat zij Abrahams zaad zijn, zijn zij allen kinderen; maar: In Izaak zal u het zaad genoemd worden.","Dat is, niet de kinderen des vleses, die zijn kinderen Gods; maar de kinderen der beloftenis worden voor het zaad gerekend.","Want dit is het woord der beloftenis: Omtrent dezen tijd zal Ik komen, en Sara zal een zoon hebben.","En niet alleenlijk deze, maar ook Rebekka is daarvan een bewijs, als zij uit een bevrucht was, namelijk Izaak, onzen vader.","Want als de kinderen nog niet geboren waren, noch iets goeds of kwaads gedaan hadden, opdat het voornemen Gods, dat naar de verkiezing is, vast bleve, niet uit de werken, maar uit den Roepende;","Zo werd tot haar gezegd: De meerdere zal den mindere dienen.","Gelijk geschreven is: Jakob heb Ik liefgehad, en Ezau heb Ik gehaat.","Wat zullen wij dan zeggen? Is er onrechtvaardigheid bij God? Dat zij verre.","Want Hij zegt tot Mozes: Ik zal Mij ontfermen, diens Ik Mij ontferm, en zal barmhartig zijn, dien Ik barmhartig ben.","Zo is het dan niet desgenen, die wil, noch desgenen, die loopt, maar des ontfermenden Gods.","Want de Schrift zegt tot Farao: Tot ditzelve heb Ik u verwekt, opdat Ik in u Mijn kracht bewijzen zou, en opdat Mijn Naam verkondigd worde op de ganse aarde.","Zo ontfermt Hij Zich dan, diens Hij wil, en verhardt, dien Hij wil.","Gij zult dan tot mij zeggen: Wat klaagt Hij dan nog? Want wie heeft Zijn wil wederstaan?","Maar toch, o mens, wie zijt gij, die tegen God antwoordt? Zal ook het maaksel tot dengenen, die het gemaakt heeft, zeggen: Waarom hebt gij mij alzo gemaakt?","Of heeft de pottenbakker geen macht over het leem, om uit denzelfden klomp te maken, het ene vat ter ere, en het andere ter onere?","En of God, willende Zijn toorn bewijzen, en Zijn macht bekend maken, met vele lankmoedigheid verdragen heeft de vaten des toorns, tot het verderf toebereid;","En opdat Hij zou bekend maken den rijkdom Zijner heerlijkheid over de vaten der barmhartigheid, die Hij te voren bereid heeft tot heerlijkheid?","Welke Hij ook geroepen heeft, namelijk ons, niet alleen uit de Joden, maar ook uit de heidenen.","Gelijk Hij ook in Hosea zegt: Ik zal hetgeen Mijn volk niet was, Mijn volk noemen, en die niet bemind was, Mijn beminde.","En het zal zijn, in de plaats, waar tot hen gezegd was: Gijlieden zijt Mijn volk niet, aldaar zullen zij kinderen des levenden Gods genaamd worden.","En Jesaja roept over Israël: Al ware het getal der kinderen Israëls gelijk het zand der zee, zo zal het overblijfsel behouden worden.","Want Hij voleindt een zaak en snijdt ze af in rechtvaardigheid; want de Heere zal een afgesneden zaak doen op de aarde.","En gelijk Jesaja te voren gezegd heeft: Indien de Heere Sebaoth ons geen zaad had overgelaten, zo waren wij als Sodom geworden, en Gomorra gelijk gemaakt geweest.","Wat zullen wij dan zeggen? Dat de heidenen, die de rechtvaardigheid niet zochten, de rechtvaardigheid verkregen hebben, doch de rechtvaardigheid, die uit het geloof is.","Maar Israël, die de wet der rechtvaardigheid zocht, is tot de wet der rechtvaardigheid niet gekomen.","Waarom? Omdat zij die zochten niet uit het geloof, maar als uit de werken der wet, want zij hebben zich gestoten aan den steen des aanstoots;","Gelijk geschreven is: Ziet, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en een iegelijk, die in Hem gelooft, zal niet beschaamd worden."],
  10: ["Broeders, de toegenegenheid mijns harten, en het gebed, dat ik tot God voor Israël doe, is tot hun zaligheid.","Want ik geef hun getuigenis, dat zij een ijver tot God hebben, maar niet met verstand.","Want alzo zij de rechtvaardigheid Gods niet kennen, en hun eigen gerechtigheid zoeken op te richten, zo zijn zij der rechtvaardigheid Gods niet onderworpen.","Want het einde der wet is Christus, tot rechtvaardigheid een iegelijk, die gelooft.","Want Mozes beschrijft de rechtvaardigheid, die uit de wet is, zeggende: De mens, die deze dingen doet, zal door dezelve leven.","Maar de rechtvaardigheid, die uit het geloof is, spreekt aldus: Zeg niet in uw hart: Wie zal in den hemel opklimmen? Hetzelve is Christus van boven afbrengen.","Of, wie zal in den afgrond nederdalen? Hetzelve is Christus uit de doden opbrengen.","Maar wat zegt zij? Nabij u is het Woord, in uw mond en in uw hart. Dit is het Woord des geloofs, hetwelk wij prediken.","Namelijk, indien gij met uw mond zult belijden den Heere Jezus, en met uw hart geloven, dat God Hem uit de doden opgewekt heeft, zo zult gij zalig worden.","Want met het hart gelooft men ter rechtvaardigheid en met den mond belijdt men ter zaligheid.","Want de Schrift zegt: Een iegelijk, die in Hem gelooft, die zal niet beschaamd worden.","Want er is geen onderscheid, noch van Jood noch van Griek; want eenzelfde is Heere van allen, rijk zijnde over allen, die Hem aanroepen.","Want een iegelijk, die den Naam des Heeren zal aanroepen, zal zalig worden.","Hoe zullen zij dan Hem aanroepen, in Welken zij niet geloofd hebben? En hoe zullen zij in Hem geloven, van Welken zij niet gehoord hebben? En hoe zullen zij horen, zonder die hun predikt?","En hoe zullen zij prediken, indien zij niet gezonden worden? Gelijk geschreven is: Hoe liefelijk zijn de voeten dergenen, die vrede verkondigen, dergenen, die het goede verkondigen!","Doch zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?","Zo is dan het geloof uit het gehoor, en het gehoor door het Woord Gods,","Maar ik zeg: Hebben zij het niet gehoord? Ja toch, hun geluid is over de gehele aarde uitgegaan, en hun woorden tot de einden der wereld.","Maar ik zeg: Heeft Israël het niet verstaan? Mozes zegt eerst: Ik zal ulieden tot jaloersheid verwekken door degenen, die geen volk zijn; door een onverstandig volk zal ik u tot toorn verwekken.","En Jesaja verstout zich, en zegt: Ik ben gevonden van degenen, die Mij niet zochten; Ik ben openbaar geworden dengenen, die naar Mij niet vraagden.","Maar tegen Israël zegt Hij: Den gehelen dag heb Ik Mijn handen uitgestrekt tot een ongehoorzaam en tegensprekend volk."],
  11: ["Ik zeg dan: Heeft God Zijn volk verstoten? Dat zij verre; want ik ben ook een Israëliet, uit het zaad Abrahams, van den stam Benjamin.","God heeft Zijn volk niet verstoten, hetwelk Hij te voren gekend heeft. Of weet gij niet, wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, zeggende:","Heere! zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn ziel.","Maar wat zegt tot hem het Goddelijk antwoord? Ik heb Mijzelven nog zeven duizend mannen overgelaten, die de knie voor het beeld van Baäl niet gebogen hebben.","Alzo is er dan ook in dezen tegenwoordigen tijd een overblijfsel geworden, naar de verkiezing der genade.","En indien het door genade is, zo is het niet meer uit de werken; anderszins is de genade geen genade meer; en indien het is uit de werken, zo is het geen genade meer; anderszins is het werk geen werk meer.","Wat dan? Hetgeen Israël zoekt, dat heeft het niet verkregen; maar de uitverkorenen hebben het verkregen, en de anderen zijn verhard geworden.","(Gelijk geschreven is: God heeft hun gegeven een geest des diepen slaaps; ogen om niet te zien, en oren om niet te horen) tot op den huidigen dag.","En David zegt: Hun tafel worde tot een strik, en tot een val, en tot een aanstoot, en tot een vergelding voor hen.","Dat hun ogen verduisterd worden, om niet te zien; en verkrom hun rug allen tijd.","Zo zeg ik dan: Hebben zij gestruikeld, opdat zij vallen zouden? Dat zij verre; maar door hun val is de zaligheid den heidenen geworden, om hen tot jaloersheid te verwekken.","En indien hun val de rijkdom is der wereld, en hun vermindering de rijkdom der heidenen, hoeveel te meer hun volheid!","Want ik spreek tot u, heidenen, voor zoveel ik der heidenen apostel ben; ik maak mijn bediening heerlijk;","Of ik enigszins mijn vlees tot jaloersheid verwekken, en enigen uit hen behouden mocht.","Want indien hun verwerping de verzoening is der wereld, wat zal de aanneming wezen, anders dan het leven uit de doden?","En indien de eerstelingen heilig zijn, zo is ook het deeg heilig, en indien de wortel heilig is, zo zijn ook de takken heilig.","En zo enige der takken afgebroken zijn, en gij, een wilde olijfboom zijnde, in derzelver plaats zijt ingeent, en des wortels en der vettigheid des olijfbooms mede deelachtig zijt geworden,","Zo roem niet tegen de takken; en indien gij daartegen roemt, gij draagt den wortel niet, maar de wortel u.","Gij zult dan zeggen: De takken zijn afgebroken, opdat ik zou ingeent worden.","Het is wel; zij zijn door ongeloof afgebroken, en gij staat door het geloof. Zijt niet hooggevoelende, maar vrees.","Want is het, dat God de natuurlijke takken niet gespaard heeft, zie toe, dat Hij ook mogelijk u niet spare.","Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over degenen, die gevallen zijn, maar de goedertierenheid over u, indien gij in de goedertierenheid blijft; anderszins zult ook gij afgehouwen worden.","Maar ook zij, indien zij in het ongeloof niet blijven, zullen ingeent worden; want God is machtig om dezelve weder in te enten.","Want indien gij afgehouwen zijt uit den olijfboom, die van nature wild was, en tegen nature in den goeden olijfboom ingeent; hoeveel te meer zullen deze, die natuurlijke takken zijn, in hun eigen olijfboom geent worden?","Want ik wil niet, broeders, dat u deze verborgenheid onbekend zij (opdat gij niet wijs zijt, bij uzelven), dat de verharding voor een deel over Israël gekomen is, totdat de volheid der heidenen zal ingegaan zijn.","En alzo zal geheel Israël zalig worden; gelijk geschreven is: De Verlosser zal uit Sion komen en zal de goddeloosheden afwenden van Jakob.","En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.","Zo zijn zij wel vijanden aangaande het Evangelie, om uwentwil, maar aangaande de verkiezing zijn zij beminden, om der vaderen wil;","Want de genadegiften en de roeping Gods zijn onberouwelijk.","Want gelijkerwijs ook gijlieden eertijds Gode ongehoorzaam geweest zijt, maar nu barmhartigheid verkregen hebt door dezer ongehoorzaamheid;","Alzo zijn ook dezen nu ongehoorzaam geweest, opdat ook zij door uw barmhartigheid zouden barmhartigheid verkrijgen.","Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen zou barmhartig zijn.","O diepte des rijkdoms, beide der wijsheid en der kennis Gods, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!","Want wie heeft den zin des Heeren gekend? Of wie is Zijn raadsman geweest?","Of wie heeft Hem eerst gegeven, en het zal hem wedervergolden worden?","Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid in der eeuwigheid. Amen."],
  12: ["Ik bid u dan, broeders, door de ontfermingen Gods, dat gij uw lichamen stelt tot een levende, heilige en Gode welbehagelijke offerande, welke is uw redelijke godsdienst.","En wordt dezer wereld niet gelijkvormig; maar wordt veranderd door de vernieuwing uws gemoeds, opdat gij moogt beproeven, welke de goede, en welbehagelijke en volmaakte wil van God zij.","Want door de genade, die mij gegeven is, zeg ik een iegelijk, die onder u is, dat hij niet wijs zij boven hetgeen men behoort wijs te zijn; maar dat hij wijs zij tot matigheid, gelijk als God een iegelijk de mate des geloofs gedeeld heeft.","Want gelijk wij in een lichaam vele leden hebben, en de leden alle niet dezelfde werking hebben;","Alzo zijn wij velen een lichaam in Christus, maar elkeen zijn wij elkanders leden.","Hebbende nu verscheidene gaven, naar de genade, die ons gegeven is,","Zo laat ons die gaven besteden, hetzij profetie, naar de mate des geloofs; hetzij bediening, in het bedienen; hetzij die leert, in het leren;","Hetzij die vermaant, in het vermanen; die uitdeelt, in eenvoudigheid; die een voorstander is, in naarstigheid; die barmhartigheid doet, in blijmoedigheid.","De liefde zij ongeveinsd. Hebt een afkeer van het boze, en hangt het goede aan.","Hebt elkander hartelijk lief met broederlijke liefde; met eer de een den ander voorgaande.","Zijt niet traag in het benaarstigen. Zijt vurig van geest. Dient den Heere.","Verblijdt u in de hoop. Zijt geduldig in de verdrukking. Volhardt in het gebed.","Deelt mede tot de behoeften der heiligen. Tracht naar herbergzaamheid.","Zegent hen, die u vervolgen; zegent en vervloekt niet.","Verblijdt u met de blijden; en weent met de wenenden.","Weest eensgezind onder elkander. Tracht niet naar de hoge dingen, maar voegt u tot de nederige. Zijt niet wijs bij uzelven.","Vergeldt niemand kwaad voor kwaad. Bezorgt hetgeen eerlijk is voor alle mensen.","Indien het mogelijk is, zoveel in u is, houdt vrede met alle mensen.","Wreekt uzelven niet, beminden, maar geeft den toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.","Indien dan uw vijand hongert, zo spijzigt hem; indien hem dorst, zo geeft hem te drinken; want dat doende, zult gij kolen vuurs op zijn hoofd hopen.","Wordt van het kwade niet overwonnen, maar overwint het kwade door het goede."],
  13: ["Alle ziel zij den machten, over haar gesteld, onderworpen; want er is geen macht dan van God, en de machten, die er zijn, die zijn van God geordineerd.","Alzo dat die zich tegen de macht stelt, de ordinantie van God wederstaat; en die ze wederstaan, zullen over zichzelven een oordeel halen.","Want de oversten zijn niet tot een vreze den goeden werken, maar den kwaden. Wilt gij nu de macht niet vrezen, doe het goede, en gij zult lof van haar hebben;","Want zij is Gods dienares, u ten goede. Maar indien gij kwaad doet, zo vrees; want zij draagt het zwaard niet te vergeefs; want zij is Gods dienares, een wreekster tot straf dengene, die kwaad doet.","Daarom is het nodig onderworpen te zijn, niet alleen om der straffe, maar ook om des gewetens wil.","Want daarom betaalt gij ook schattingen; want zij zijn dienaars van God, in ditzelve geduriglijk bezig zijnde.","Zo geeft dan een iegelijk, wat gij schuldig zijt; schatting, dien gij de schatting, tol, dien gij den tol, vreze, dien gij de vreze, eer, dien gij de eer schuldig zijt.","Zijt niemand iets schuldig, dan elkander lief te hebben; want die den ander liefheeft, die heeft de wet vervuld.","Want dit: Gij zult geen overspel doen, gij zult niet doden, gij zult niet stelen, gij zult geen valse getuigenis geven, gij zult niet begeren; en zo er enig ander gebod is, wordt in dit woord als in een hoofdsom begrepen, namelijk in dit: Gij zult uw naaste liefhebben gelijk uzelven.","De liefde doet den naaste geen kwaad. Zo is dan de liefde de vervulling der wet.","En dit zeg ik te meer, dewijl wij de gelegenheid des tijds weten, dat het de ure is, dat wij nu uit den slaap opwaken; want de zaligheid is ons nu nader, dan toen wij eerst geloofd hebben.","De nacht is voorbijgegaan, en de dag is nabij gekomen. Laat ons dan afleggen de werken der duisternis, en aandoen de wapenen des lichts.","Laat ons, als in den dag, eerlijk wandelen; niet in brasserijen en dronkenschappen, niet in slaapkameren en ontuchtigheden, niet in twist en nijdigheid;","Maar doet aan den Heere Jezus Christus, en verzorgt het vlees niet tot begeerlijkheden."],
  14: ["Dengene nu, die zwak is in het geloof, neemt aan, maar niet tot twistige samensprekingen.","De een gelooft wel, dat men alles eten mag, maar die zwak is, eet moeskruiden.","Die daar eet, verachte hem niet, die niet eet; en die niet eet, oordele hem niet, die daar eet; want God heeft hem aangenomen.","Wie zijt gij, die eens anderen huisknecht oordeelt? Hij staat, of hij valt zijn eigen heer; doch hij zal vastgesteld worden, want God is machtig hem vast te stellen.","De een acht wel den enen dag boven den anderen dag; maar de ander acht al de dagen gelijk. Een iegelijk zij in zijn eigen gemoed ten volle verzekerd.","Die den dag waarneemt, die neemt hem waar den Heere; en die den dag niet waarneemt, die neemt hem niet waar den Heere. Die daar eet, die eet zulks den Heere, want hij dankt God; en die niet eet, die eet zulks den Heere niet, en hij dankt God.","Want niemand van ons leeft zichzelven, en niemand sterft zichzelven.","Want hetzij dat wij leven, wij leven den Heere; hetzij dat wij sterven, wij sterven den Heere. Hetzij dan dat wij leven, hetzij dat wij sterven, wij zijn des Heeren.","Want daartoe is Christus ook gestorven, en opgestaan, en weder levend geworden, opdat Hij beiden over doden en levenden heersen zou.","Maar gij, wat oordeelt gij uw broeder? Of ook gij, wat veracht gij uw broeder? Want wij zullen allen voor den rechterstoel van Christus gesteld worden.","Want er is geschreven: Ik leef, zegt de Heere; voor Mij zal alle knie zich buigen, en alle tong zal God belijden.","Zo dan een iegelijk van ons zal voor zichzelven Gode rekenschap geven.","Laat ons dan elkander niet meer oordelen; maar oordeelt dit liever, namelijk, dat gij den broeder geen aanstoot of ergernis geeft.","Ik weet en ben verzekerd in den Heere Jezus, dat geen ding onrein is in zichzelven; dan die acht iets onrein te zijn, dien is het onrein.","Maar indien uw broeder om der spijze wil bedroefd wordt, zo wandelt gij niet meer naar liefde. Verderf dien niet met uw spijze, voor welken Christus gestorven is.","Dat dan uw goed niet gelasterd worde.","Want het Koninkrijk Gods is niet spijs en drank, maar rechtvaardigheid, en vrede, en blijdschap, door den Heiligen Geest.","Want die Christus in deze dingen dient, is Gode welbehagelijk, en aangenaam den mensen.","Zo dan laat ons najagen, hetgeen tot den vrede, en hetgeen tot de stichting onder elkander dient.","Verbreek het werk van God niet om der spijze wil. Alle dingen zijn wel rein; maar het is kwaad den mens, die met aanstoot eet.","Het is goed geen vlees te eten, noch wijn te drinken, noch iets, waaraan uw broeder zich stoot, of geërgerd wordt, of waarin hij zwak is.","Hebt gij geloof? hebt dat bij uzelven voor God. Zalig is hij, die zichzelven niet oordeelt in hetgeen hij voor goed houdt.","Maar die twijfelt, indien hij eet, is veroordeeld, omdat hij niet uit het geloof eet. En al wat uit het geloof niet is, dat is zonde."],
  15: ["Maar wij, die sterk zijn, zijn schuldig de zwakheden der onsterken te dragen, en niet onszelven te behagen.","Dat dan een iegelijk van ons zijn naaste behage ten goede, tot stichting.","Want ook Christus heeft Zichzelven niet behaagd, maar gelijk geschreven is: De smadingen dergenen, die U smaden, zijn op Mij gevallen.","Want al wat te voren geschreven is, dat is tot onze lering te voren geschreven, opdat wij, door lijdzaamheid en vertroosting der Schriften, hoop hebben zouden.","Doch de God der lijdzaamheid en der vertroosting geve u, dat gij eensgezind zijt onder elkander naar Christus Jezus;","Opdat gij eendrachtelijk, met een mond, moogt verheerlijken den God en Vader van onzen Heere Jezus Christus.","Daarom neemt elkander aan, gelijk ook Christus ons aangenomen heeft, tot de heerlijkheid Gods.","En ik zeg, dat Jezus Christus een dienaar geworden is der besnijdenis, vanwege de waarheid Gods, opdat Hij bevestigen zou de beloftenissen der vaderen;","En de heidenen God vanwege de barmhartigheid zouden verheerlijken; gelijk geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.","En wederom zegt Hij: Weest vrolijk, gij heidenen met Zijn volk!","En wederom: Looft den Heere, al gij heidenen, en prijst Hem, al gij volken!","En wederom zegt Jesaja: Er zal zijn de wortel van Jessai, en Die opstaat, om over de heidenen te gebieden; op Hem zullen de heidenen hopen.","De God nu der hoop vervulle ulieden met alle blijdschap en vrede in het geloven, opdat gij overvloedig moogt zijn in de hoop, door de kracht des Heiligen Geestes.","Doch, mijn broeders, ook ik zelf ben verzekerd van u, dat gij ook zelven vol zijt van goedheid, vervuld met alle kennis, machtig om ook elkander te vermanen.","Maar ik heb u eensdeels te stoutelijker geschreven, broeders, u als wederom dit indachtig makende, om de genade, die mij van God gegeven is;","Opdat ik een dienaar van Jezus Christus zij onder de heidenen, het Evangelie van God bedienende, opdat de offerande der heidenen aangenaam worde, geheiligd door den Heiligen Geest.","Zo heb ik dan roem in Christus Jezus in die dingen, die God aangaan.","Want ik zou niet durven iets zeggen, hetwelk Christus door mij niet gewrocht heeft, tot gehoorzaamheid der heidenen, met woorden en werken;","Door kracht van tekenen en wonderheden, en door de kracht van den Geest Gods, zodat ik, van Jeruzalem af, en rondom, tot Illyrikum toe, het Evangelie van Christus vervuld heb.","En alzo zeer begerig geweest ben om het Evangelie te verkondigen, niet waar Christus genoemd was, opdat ik niet op eens anders fondament zou bouwen;","Maar gelijk geschreven is: Denwelken van Hem niet was geboodschapt, die zullen het zien; en dewelke het niet gehoord hebben, die zullen het verstaan.","Waarom ik ook menigmaal verhinderd geweest ben tot u te komen.","Maar nu geen plaats meer hebbende in deze gewesten, en van over vele jaren groot verlangen hebbende, om tot u te komen,","Zo zal ik, wanneer ik naar Spanje reis, tot u komen; want ik hoop in het doorreizen u te zien, en van u derwaarts geleid te worden, als ik eerst van ulieder tegenwoordigheid eensdeels verzadigd zal zijn.","Maar nu reis ik naar Jeruzalem, dienende de heiligen.","Want het heeft dien van Macedonië en Achaje goed gedacht een gemene handreiking te doen aan de armen onder de heiligen, die te Jeruzalem zijn.","Want het heeft hun zo goed gedacht; ook zijn zij hun schuldenaars; want indien de heidenen hunner geestelijke goederen deelachtig zijn geworden, zo zijn zij ook schuldig hen van lichamelijke goederen te dienen.","Als ik dan dit volbracht, en hun deze vrucht verzegeld zal hebben, zo zal ik door ulieder stad naar Spanje afkomen.","En ik weet, dat ik, tot u komende, met vollen zegen des Evangelies van Christus komen zal.","En ik bid u, broeders, door onzen Heere Jezus Christus, en door de liefde des Geestes, dat gij met mij strijdt in de gebeden tot God voor mij;","Opdat ik mag bevrijd worden van de ongehoorzamen in Judea, en dat deze mijn dienst, dien ik aan Jeruzalem doe, aangenaam zij den heiligen;","Opdat ik met blijdschap, door den wil van God, tot u mag komen, en met u verkwikt worden.","En de God des vredes zij met u allen. Amen."],
  16: ["En ik beveel u Febe, onze zuster, die een dienares is der Gemeente, die te Kenchreen is;","Opdat gij haar ontvangt in den Heere, gelijk het den heiligen betaamt, en haar bijstaat, in wat zaak zij u zou mogen van doen hebben; want zij is een voorstandster geweest van velen, ook van mijzelven.","Groet Priscilla en Aquila, mijn medewerkers in Christus Jezus;","Die voor mijn leven hun hals gesteld hebben; denwelken niet alleen ik danke, maar ook al de Gemeenten der heidenen.","Groet ook de Gemeente in hun huis. Groet Epenetus, mijn beminde, die de eersteling is van Achaje in Christus.","Groet Maria, die veel voor ons gearbeid heeft.","Groet Andronikus en Junias, mijn magen, en mijn medegevangenen, welke vermaard zijn onder de apostelen, die ook voor mij in Christus geweest zijn.","Groet Amplias, mijn beminde in den Heere.","Groet Urbanus, onzen medearbeider in Christus, en Stachys, mijn beminde.","Groet Apelles, die beproefd is in Christus. Groet hen, die van het huisgezin van Aristobulus zijn.","Groet Herodion, die van mijn maagschap is. Groet hen, die van het huisgezin van Narcissus zijn, degenen namelijk, die in den Heere zijn.","Groet Tryfena en Tryfosa, vrouwen die in den Heere arbeiden. Groet Persis, de beminde zuster, die veel gearbeid heeft in den Heere.","Groet Rufus, den uitverkorene in den Heere, en zijn moeder en de mijne.","Groet Asynkritus, Flegon, Hermas, Patrobas, Hermes, en de broeders, die met hen zijn.","Groet Filologus en Julia, Nereus en zijn zuster, en Olympas, en al de heiligen, die met henlieden zijn.","Groet elkander met een heiligen kus. De Gemeenten van Christus groeten ulieden.","En ik bid u, broeders, neemt acht op degenen, die tweedracht en ergernissen aanrichten tegen de leer, die gij van ons geleerd hebt; en wijkt af van dezelve.","Want dezulken dienen onzen Heere Jezus Christus niet, maar hun buik; en verleiden door schoonspreken en prijzen de harten der eenvoudigen.","Want uw gehoorzaamheid is tot kennis van allen gekomen. Ik verblijde mij dan uwenthalve; en ik wil, dat gij wijs zijt in het goede, doch onnozel in het kwade.","En de God des vredes zal den satan haast onder uw voeten verpletteren. De genade van onzen Heere Jezus Christus zij met ulieden. Amen.","U groeten, Timotheüs, mijn medearbeider, en Lucius, en Jason, en Socipater, mijn bloedverwanten.","Ik, Tertius, die den brief geschreven heb, groet u in den Heere.","U groet Gajus, de huiswaard van mij en van de gehele Gemeente. U groet Erastus, de rentmeester der stad, en de broeder Quartus.","De genade van onzen Heere Jezus Christus zij met u allen. Amen.","Hem nu, Die machtig is u te bevestigen, naar mijn Evangelie en de prediking van Jezus Christus, naar de openbaring der verborgenheid, die van de tijden der eeuwen verzwegen is geweest;","Maar nu geopenbaard is, en door de profetische Schriften, naar het bevel des eeuwigen Gods, tot gehoorzaamheid des geloofs, onder al de heidenen bekend is gemaakt;","Den zelven alleen wijzen God zij door Jezus Christus de heerlijkheid in der eeuwigheid. Amen."],
};

function dayOfYear(d) { const s = new Date(d.getFullYear(), 0, 0); return Math.floor((d - s) / 86400000); }
const todaysHalte = () => BRIEF.haltes[dayOfYear(new Date()) % BRIEF.haltes.length];

// Dagelijkse overdenkingen uit de brede Paulus (los van de Romeinen-reis), uitgebreid met stemmen uit de traditie.
const DAGTEKSTEN = [
  { ref: "Filippenzen 4:6-7", boek: "Filippenzen", passage: "Weest in geen ding bezorgd; maar laat uw begeerten in alles, door bidden en smeken, met dankzegging bekend worden bij God.", overdenking: "Paulus schreef dit vanuit een gevangeniscel, niet vanuit een rustige studeerkamer. Dat verandert alles aan hoe je deze woorden hoort. Vrede is hier geen afwezigheid van problemen, geen leven waarin niets meer misgaat. Het is een wacht die over je hart staat, juist terwijl de omstandigheden rommelig blijven.\n\nAugustinus opende zijn Belijdenissen met de beroemde zin dat ons hart onrustig is totdat het rust vindt in God. Dat is precies wat hier gebeurt: de onrust verdwijnt niet doordat de situatie oplost, maar doordat je je zorgen ergens kunt neerleggen. Je hoeft niet te wachten tot alles geregeld is voordat je rust mag voelen.", bron: "Augustinus: 'Onrustig is ons hart, totdat het rust vindt in U' (Belijdenissen, boek 1)." },
  { ref: "Galaten 2:20", boek: "Galaten", passage: "Ik ben met Christus gekruist; en ik leef, doch niet meer ik, maar Christus leeft in mij.", overdenking: "Let op wat Paulus hier niet zegt. Hij zegt niet 'ik doe voortaan extra mijn best voor Christus'. Hij zegt: 'Christus leeft in mij'. Je identiteit verschuift van wat jij presteert naar Wie er in je woont. Dat haalt de druk eraf zonder de richting te verliezen.\n\nLuther noemde dit de kern van het christelijk leven: je leeft niet meer vanuit jezelf, maar vanuit een vreemde grond buiten jezelf. Je staat, zei hij, niet op je eigen prestatie maar op Christus, zoals je op een rots staat die je niet zelf gelegd hebt. Dat is bevrijdend voor wie moe wordt van zichzelf bewijzen.", bron: "Maarten Luther over Galaten 2:20, in zijn commentaar op de Galatenbrief (1535), zijn meest geliefde werk." },
  { ref: "Efeziërs 2:8", boek: "Efeziërs", passage: "Want uit genade zijt gij zalig geworden door het geloof; en dat niet uit u, het is Gods gave.", overdenking: "Je krijgt het, je verdient het niet. Dat ene zinnetje, 'het is Gods gave', ontwapent twee dingen tegelijk: je trots, want je hebt niets om op te roemen, en je schaamte, want je hoeft het ook niet te verdienen. Genade is per definitie iets voor wie het niet kan verdienen, anders zou het loon heten.\n\nAugustinus vocht hierover een leven lang met wie meende dat de mens zichzelf kon redden door inspanning. Zijn conclusie werd het hart van de westerse theologie: alles is genade, zelfs het geloof waarmee je de genade aanneemt is al een geschenk. Je staat met lege handen, en juist daar wordt je hand gevuld.", bron: "Augustinus, in zijn strijd tegen Pelagius: zelfs het geloof is een gave van God, niet een prestatie van de mens." },
  { ref: "1 Korintiërs 13:4", boek: "1 Korintiërs", passage: "De liefde is lankmoedig, zij is goedertieren; de liefde is niet afgunstig.", overdenking: "Dit hoofdstuk wordt op bruiloften gelezen, maar Paulus schreef het aan een gemeente vol ruzie en jaloezie. Liefde is hier geen romantisch gevoel, het is de lijm die mensen bij elkaar houdt juist als ze elkaar niet liggen. Geduldig, niet opgeblazen, niet uit op haar eigen gelijk.\n\nAugustinus vatte de hele christelijke moraal ooit samen in vier gedurfde woorden: 'heb lief, en doe dan wat je wilt'. Niet als vrijbrief voor egoïsme, maar als diepe waarheid: wie werkelijk liefheeft, wil vanzelf het goede voor de ander. De liefde is geen regel die je naleeft, maar een bron waaruit het juiste vanzelf voortkomt.", bron: "Augustinus: 'Dilige, et quod vis fac' (heb lief, en doe wat je wilt), uit zijn preken over de eerste brief van Johannes." },
  { ref: "2 Korintiërs 12:9", boek: "2 Korintiërs", passage: "Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht.", overdenking: "Paulus bad drie keer of een 'doorn in het vlees' weggenomen mocht worden, een kwelling die we niet eens precies kennen. Het antwoord was geen genezing maar een belofte. Niet ondanks je zwakke plek, maar er dwars doorheen werkt God. Dat is een vreemde rekensom: zwakte wordt de plaats waar kracht zichtbaar wordt.\n\nKarl Barth zag hierin het hele evangelie tegen onze prestatiedrang in: God begint juist daar waar de mens aan het eind van zijn kunnen is. Niet onze sterke kant is het aangrijpingspunt van genade, maar onze grens, ons tekort, het punt waarop we het niet meer zelf kunnen. Voor wie sterk moet doen om gezien te worden, is dit een verademing.", bron: "Karl Barth: genade grijpt juist aan bij de grens van het menselijk vermogen, niet bij onze kracht." },
  { ref: "Filippenzen 1:6", boek: "Filippenzen", passage: "Vertrouwende ditzelve, dat Hij, Die in u een goed werk begonnen heeft, dat voleindigen zal.", overdenking: "Het goede werk in jou is geen project dat jij moet afmaken, het is een werk dat afgemaakt wórdt. Niet jij bent de garantie dat het goed komt met je geloof en je groei, God is dat. Dat scheelt een hoop slapeloze nachten en geestelijke zelfcontrole.\n\nAugustinus noemde dit het geheim van de volharding: dat wij blijven, is uiteindelijk geen prestatie van onze wilskracht maar een gave van God die vasthoudt wat Hij begon. Je hoeft niet bang te zijn dat je het zelf verprutst, want de Eén die begon, is ook de Eén die afmaakt. Jouw aandeel is vertrouwen, niet bewaken.", bron: "Augustinus over de volharding der heiligen: wat God begint, brengt Hij ook tot voltooiing." },
  { ref: "Kolossenzen 3:13", boek: "Kolossenzen", passage: "Verdragende elkander, en vergevende de een den anderen; gelijkerwijs als Christus u vergeven heeft.", overdenking: "De maat van je vergeving is niet wat de ander verdient, maar wat jij zelf ontvangen hebt. Dat is een ander ijkpunt dan we gewend zijn. We meten meestal of iemand het waard is, of het genoeg is geweest, of er genoeg spijt is. Paulus zegt: kijk niet naar de ander, kijk naar wat jou is kwijtgescholden.\n\nLuther beschreef de christen als een mens die helemaal leeft van ontvangen vergeving, en daardoor vrij wordt om die door te geven. Vergeving stroomt door, ze blijft niet bij jou hangen als een schat die je oppot. Wie zelf grenzeloos is vergeven, kan niet kleinzielig blijven rekenen bij een ander.", bron: "Maarten Luther: de gerechtvaardigde mens leeft uit ontvangen genade en geeft die vrij door aan de naaste." },
  { ref: "1 Tessalonicenzen 5:21", boek: "1 Tessalonicenzen", passage: "Beproeft alle dingen; behoudt het goede.", overdenking: "Geloof is geen verstand uitschakelen, maar het juist gebruiken. Paulus vraagt geen blind volgen, maar een open en onderscheidend hart: weeg alles, en houd vast wat goed blijkt. Dat is een verrassend nuchtere oproep in een brief vol verwachting.\n\nKarl Barth maakte er zijn levenswerk van om alles te toetsen, ook de kerk, ook de vroomheid, ook de eigen overtuigingen, aan het Woord van God. Niets is boven kritiek verheven behalve God zelf. Tegelijk is toetsen geen cynisme: het doel is niet afbreken maar 'het goede behouden'. Je zift niet om alles weg te gooien, maar om vast te houden wat standhoudt.", bron: "Karl Barth maakte het kritisch toetsen van alle menselijke zekerheden aan Gods Woord tot kern van zijn theologie." },
  { ref: "1 Timoteüs 1:15", boek: "1 Timoteüs", passage: "Christus Jezus is in de wereld gekomen, om de zondaren zalig te maken, van welke ik de voornaamste ben.", overdenking: "De grote apostel noemt zichzelf niet het rolmodel maar het bewijsstuk: als hij, die de kerk vervolgde, genade kon ontvangen, dan werkelijk iedereen. Niemand staat buiten bereik. Dat is geen vrome bescheidenheid maar de logica van het evangelie zelf.\n\nLuther vatte de gelovige samen als 'simul iustus et peccator', tegelijk rechtvaardig en zondaar. Je hoeft niet te doen alsof je het zonde-zijn ontgroeid bent voordat je je aanvaard mag weten. Augustinus, die in zijn Belijdenissen genadeloos eerlijk was over zijn eigen verleden, liet zien dat juist die eerlijkheid de deur is waardoor de genade binnenkomt. Schaamte krijgt hier niet het laatste woord.", bron: "Luther: 'simul iustus et peccator' (tegelijk rechtvaardig en zondaar). Augustinus, Belijdenissen, over eerlijke zelfkennis." },
  { ref: "2 Timoteüs 4:7", boek: "2 Timoteüs", passage: "Ik heb den goeden strijd gestreden, ik heb den loop geëindigd, ik heb het geloof behouden.", overdenking: "Dit zijn vermoedelijk Paulus' laatste woorden, geschreven vlak voor zijn dood. Het zijn geen woorden van iemand die alles foutloos deed, maar van iemand die volhield. De finish telt, niet de perfectie van elke meter. Dat is een troost voor wie struikelt: het gaat niet om een vlekkeloze race maar om aankomen.\n\nAugustinus, die zelf pas laat tot geloof kwam na jaren van afdwalen, wist als geen ander dat de weg naar God kronkelig kan zijn. Niet hoe je begon bepaalt de uitkomst, maar of je het geloof vasthoudt tot het einde. En zelfs dat vasthouden, voegde hij eraan toe, is uiteindelijk Gods werk in ons, niet enkel onze eigen wilskracht.", bron: "Augustinus, wiens eigen weg naar het geloof lang en kronkelig was (Belijdenissen), over volharding als gave." },
  { ref: "Galaten 5:1", boek: "Galaten", passage: "Staat dan in de vrijheid, met welke ons Christus vrijgemaakt heeft.", overdenking: "Vrijheid is niet vanzelfsprekend, je moet erin blijven staan. De verleiding om terug te kruipen in regels en zelfveroordeling is groot, want regels voelen veilig en overzichtelijk. Een afvinklijstje geeft het gevoel dat je het in de hand hebt. Maar Paulus noemt dat juist een juk.\n\nLuther schreef een heel boek hierover, 'De vrijheid van een christen', met de beroemde paradox: een christen is een volkomen vrij heer, aan niemand onderworpen, én tegelijk een volkomen dienstbare knecht, aan iedereen onderworpen. Vrij van het moeten verdienen van Gods gunst, en juist daardoor vrij om de ander te dienen zonder angst. Vrijheid en liefde sluiten elkaar niet uit, ze horen bij elkaar.", bron: "Maarten Luther, 'Over de vrijheid van een christen' (1520): vrij heer en dienstbare knecht tegelijk." },
  { ref: "Filippenzen 4:13", boek: "Filippenzen", passage: "Ik vermag alle dingen door Christus, Die mij kracht geeft.", overdenking: "Dit vers staat op posters en sportshirts, maar de context is bescheidener en mooier. Paulus zegt het niet over grote prestaties, maar over tevreden zijn met weinig én met veel. Hij heeft geleerd te leven met overvloed en met gebrek. De kracht zit niet in zijn ambitie, maar in zijn rust.\n\nKarl Barth waarschuwde ervoor om God in te zetten als een hulpmotor voor onze eigen plannen, alsof geloof een manier is om méér te bereiken. Het evangelie keert dat om: niet jouw doelen krijgen goddelijke kracht, maar jij wordt vrijgemaakt van de dwang om alles te moeten. De kracht waar Paulus over spreekt is niet die van de winnaar, maar die van de tevredene.", bron: "Karl Barth waarschuwde tegen het gebruik van God als versterking van eigen ambitie; genade bevrijdt juist van die dwang." },
  { ref: "Efeziërs 4:32", boek: "Efeziërs", passage: "Maar zijt jegens elkander goedertieren, barmhartig, vergevende elkander.", overdenking: "Goedheid is geen zwakte maar kracht onder controle. Wie zelf barmhartigheid heeft geproefd, kan het uitdelen zonder bang te zijn dat het opraakt. Paulus koppelt onze vriendelijkheid steeds aan wat we eerst zelf ontvingen, 'gelijk ook God in Christus u vergeven heeft'. De volgorde is altijd: eerst ontvangen, dan geven.\n\nAugustinus zag de liefde als het zwaartepunt van de ziel: 'mijn liefde is mijn gewicht, daardoor word ik gedragen waarheen ik ook ga'. Wat je liefhebt, bepaalt waar je naartoe beweegt. Word je gedreven door angst en eigenbelang, dan word je hard. Word je gedragen door ontvangen liefde, dan word je vanzelf milder voor de mensen om je heen.", bron: "Augustinus: 'Amor meus, pondus meum' (mijn liefde is mijn gewicht), Belijdenissen, boek 13." },
  { ref: "Kolossenzen 3:23", boek: "Kolossenzen", passage: "En al wat gij doet, doet dat van harte, als den Heere en niet den mensen.", overdenking: "Je werk, hoe gewoon ook, krijgt een andere richting als je het niet doet om indruk te maken op mensen, maar als dienst aan God. Dat haalt twee dingen weg: de angst voor het oordeel van anderen, en de leegte van werk dat alleen om applaus draait. Het maakt zelfs het kleinste en saaiste werk zinvol.\n\nLuther maakte hier een revolutie van met zijn idee van het 'beroep als roeping': de boer achter de ploeg en de moeder bij de wieg dienen God net zo goed als de monnik in het klooster. Er is geen heilig en gewoon werk, er is alleen werk dat je in liefde en trouw doet. Dat tilt je maandagochtend op hetzelfde niveau als je zondag.", bron: "Maarten Luther over het 'beroep' (Beruf) als roeping: alledaags werk in trouw gedaan is dienst aan God." },
];
const dagtekstVandaag = () => DAGTEKSTEN[dayOfYear(new Date()) % DAGTEKSTEN.length];
// Verst gevorderde, of eerste niet-voltooide plek in de reis
function huidigeStap(done) {
  for (let i = 0; i < BRIEF.haltes.length; i++) { if (!done[BRIEF.haltes[i].key]) return i; }
  return 0;

// ── Halte ──
function HalteView({ halte, note, onNote, onShare, shareMsg, onReadChapter }) {
  const [local, setLocal] = useState(note || "");
  const [savedMsg, setSavedMsg] = useState("");
  useEffect(() => { setLocal(note || ""); }, [halte.key, note]);
  function blur() { onNote(halte.key, local); if (local && local.trim()) { setSavedMsg("Opgeslagen"); setTimeout(() => setSavedMsg(""), 1600); } }
  return (
    <div className="halte" key={halte.key}>
      <div className="chap r r1">Hoofdstuk<span className="num">{halte.hfdst}</span></div>
      <blockquote className="passage r r2"><span className="qm">”</span><span className="body">{halte.passage}</span><span className="ref">{halte.ref} · Statenvertaling</span></blockquote>
      <div className="r r3">
        <div className="lbl">Overdenking</div>
        <div className="overd">{halte.overdenking.split("\n\n").map((p, i) => (<p key={i}>{p}</p>))}</div>
      </div>
      <div className="readfull r r4">
        <button className="readbtn" onClick={() => onReadChapter(halte.hfdst)}>Lees hier Romeinen {halte.hfdst} in z'n geheel →</button>
      </div>
      <div className="bron r r5"><span className="bl">Ter verdieping</span><p>{halte.bron}</p></div>
      <div className="gebed r r5"><span className="gl">Gebed</span><p>{halte.gebed}</p></div>
      <div className="vraagbox r r6">
        <div className="lbl" style={{ marginTop: 0 }}>Om over na te denken</div>
        <p className="vraag">{halte.vraag}</p>
        <textarea className="note" placeholder="Schrijf hier je gedachten… (wordt bewaard)" value={local} onChange={(e) => setLocal(e.target.value)} onBlur={blur} />
        <div className="saved">{savedMsg}</div>
      </div>
      <div className="share-row r r7"><button className="btn ghost sm" onClick={() => onShare(halte)}>↗ Deel deze overdenking</button></div>
      <div className="share-msg">{shareMsg}</div>
    </div>
  );
}
