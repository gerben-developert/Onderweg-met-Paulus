function App() {
  const [tab, setTab] = useState("vandaag");
  const [reading, setReading] = useState(false);
  const [step, setStep] = useState(0);
  const [done, setDone] = useState({});
  const [notes, setNotes] = useState({});
  const [shareMsg, setShareMsg] = useState("");
  const [chapterOpen, setChapterOpen] = useState(null); // hoofdstuknummer of null
  const scrollRef = useRef(null);

  const dagtekst = useMemo(() => dagtekstVandaag(), []);
  const today = useMemo(() => todayLabel(), []);

  useEffect(() => {
    (async () => {
      try { const d = await window.storage.get("rom:done"); if (d?.value) setDone(JSON.parse(d.value)); } catch (e) {}
      try { const n = await window.storage.get("rom:notes"); if (n?.value) setNotes(JSON.parse(n.value)); } catch (e) {}
    })();
  }, []);

  function toTop() { if (scrollRef.current) scrollRef.current.scrollTop = 0; }
  async function markDone(key) { const next = { ...done, [key]: true }; setDone(next); try { await window.storage.set("rom:done", JSON.stringify(next)); } catch (e) {} }
  async function saveNote(key, text) { const next = { ...notes }; if (text && text.trim()) next[key] = text; else delete next[key]; setNotes(next); try { await window.storage.set("rom:notes", JSON.stringify(next)); } catch (e) {} }
  async function shareHalte(halte) {
    const text = `"${halte.passage}"\n— ${halte.ref} (Statenvertaling)\n\n${halte.overdenking}\n\nUit "Onderweg met Paulus, door de Romeinen"`;
    if (navigator.share) { try { await navigator.share({ title: "Onderweg met Paulus", text }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(text); setShareMsg("Gekopieerd, plak het waar je wilt"); }
    catch (e) { setShareMsg("Kon niet automatisch delen, selecteer en kopieer de tekst"); }
    setTimeout(() => setShareMsg(""), 2400);
  }
  async function shareDagtekst(d) {
    const text = `"${d.passage}"\n— ${d.ref} (Statenvertaling)\n\n${d.overdenking}\n\nUit "Onderweg met Paulus"`;
    if (navigator.share) { try { await navigator.share({ title: "Onderweg met Paulus", text }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(text); setShareMsg("Gekopieerd, plak het waar je wilt"); }
    catch (e) { setShareMsg("Kon niet automatisch delen, selecteer en kopieer de tekst"); }
    setTimeout(() => setShareMsg(""), 2400);
  }
  function openRead(i) { setStep(i); setReading(true); setTab("brief"); toTop(); }
  function openChapter(n) { setChapterOpen(n); toTop(); }

  const halte = BRIEF.haltes[step];
  const atEnd = reading && step >= BRIEF.haltes.length;
  const doneCount = BRIEF.haltes.filter((h) => done[h.key]).length;
  const noteList = Object.keys(notes).map((key) => { const h = BRIEF.haltes.find((x) => x.key === key); return h ? { ...h, text: notes[key] } : null; }).filter(Boolean);

  return (
    <div className="ow">
      <style>{styles}</style>
      <div className="ow-scroll" ref={scrollRef}>
        <div className="ow-inner">

          {/* BIJBELLEZER (over alles heen) */}
          {chapterOpen && (
            <div className="r r1">
              <button className="back" onClick={() => { setChapterOpen(null); toTop(); }}>← Terug</button>
              <div className="bijbel">
                <h2>Romeinen {chapterOpen}<span className="bsub">Statenvertaling</span></h2>
                {(VOLLEDIG[chapterOpen] || []).map((v, i) => (
                  <p key={i} className="vers"><span className="vn">{i + 1}</span>{v}</p>
                ))}
                <div className="chapnav">
                  <button className="btn ghost sm" disabled={chapterOpen <= 1} onClick={() => { setChapterOpen(chapterOpen - 1); toTop(); }}>← Rom. {chapterOpen - 1}</button>
                  <span className="cnlabel">{chapterOpen} / 16</span>
                  <button className="btn ghost sm" disabled={chapterOpen >= 16} onClick={() => { setChapterOpen(chapterOpen + 1); toTop(); }}>Rom. {chapterOpen + 1} →</button>
                </div>
              </div>
              <div className="foot">
                <p className="source">Bijbeltekst: Statenvertaling (Jongbloed-editie), publiek domein.</p>
              </div>
            </div>
          )}

          {!chapterOpen && <>

          {!reading && (
            <div className="ow-top">
              <div className="eyebrow">Bijbelstudie</div>
              <h1>Onderweg met <em>Paulus</em></h1>
              <div className="sub">{BRIEF.subtitle}</div>
            </div>
          )}

          {tab === "vandaag" && !reading && (
            <div className="r r1">
              <div className="hero-date">{today}</div>
              <div className="hero-sub">Een woord van Paulus voor vandaag</div>

              <div className="dagkaart">
                <div className="dagboek">Uit {dagtekst.boek}</div>
                <p className="dagpassage">{dagtekst.passage}</p>
                <div className="dagref">{dagtekst.ref} · Statenvertaling</div>
                <div className="dagoverd">
                  {dagtekst.overdenking.split("\n\n").map((alinea, i) => (
                    <p key={i} style={{ marginTop: i === 0 ? 0 : 16 }}>{alinea}</p>
                  ))}
                </div>
                {dagtekst.bron && (
                  <div className="bron" style={{ marginTop: 22 }}><span className="bl">Uit de traditie</span><p>{dagtekst.bron}</p></div>
                )}
                <div className="share-row" style={{ marginTop: 22 }}>
                  <button className="btn ghost sm" onClick={() => shareDagtekst(dagtekst)}>↗ Deel</button>
                </div>
                <div className="share-msg">{shareMsg}</div>
              </div>

              <div className="vervolg" onClick={() => openRead(huidigeStap(done))} style={{ cursor: "pointer" }}>
                <div className="vk">Verder in de Romeinenbrief</div>
                <div className="vt">Hoofdstuk {BRIEF.haltes[huidigeStap(done)].hfdst}</div>
                <div className="vs">{doneCount > 0 ? `Je bent ${doneCount} van de 16 hoofdstukken door` : "Begin de leesreis"}</div>
                <div style={{ display:"flex", justifyContent:"center", marginTop:16 }}>
                  <button className="btn" onClick={(e) => { e.stopPropagation(); openRead(huidigeStap(done)); }}>
                    {doneCount > 0 ? "Verder lezen" : "Begin de reis"} →
                  </button>
                </div>
              </div>

              <div className="foot">
                <p className="verse">"Want ik ben verzekerd, dat noch dood, noch leven… ons zal kunnen scheiden van de liefde Gods, welke is in Christus Jezus."</p>
                <div className="vref">Romeinen 8:38-39 · Statenvertaling</div>
              </div>
            </div>
          )}

          {tab === "brief" && !reading && (
            <div className="r r1">
              <div className="intro-card">
                <h2>De brief aan de {BRIEF.title}</h2>
                <p className="meta">{BRIEF.plaats} · {BRIEF.kern}</p>
                <p className="txt">{BRIEF.intro}</p>
                <div style={{ marginTop:20 }}>
                  <button className="btn" onClick={() => openRead(0)}>{doneCount > 0 ? "Verder lezen" : "Begin de reis"} →</button>
                </div>
              </div>
              <div className="cardlist">
                {BRIEF.haltes.map((h, i) => (
                  <article key={h.key} className="lcard" onClick={() => openRead(i)}>
                    <div className="cn">{h.hfdst}</div>
                    <div className="ct"><div className="cr">{h.ref}</div><div className="cd">{h.thema}</div></div>
                    {done[h.key] && <div className="cc">✓</div>}
                  </article>
                ))}
              </div>
              <div className="foot">
                <div className="vref">Onderweg met Paulus · {BRIEF.title}</div>
                <p className="source">Bijbeltekst: Statenvertaling (Jongbloed-editie), publiek domein. Overdenkingen en gebeden zijn eigen tekst; bronvermeldingen verwijzen naar gezaghebbende commentaren (o.a. Cranfield, Moo, Schreiner, Calvijn, Barth).</p>
              </div>
            </div>
          )}

          {reading && (
            <div>
              <button className="back" onClick={() => { setReading(false); toTop(); }}>← Inhoud</button>
              {!atEnd && (
                <>
                  <HalteView halte={halte} note={notes[halte.key]} onNote={saveNote} onShare={shareHalte} shareMsg={shareMsg} onReadChapter={openChapter} />
                  <div className="halte-nav">
                    <button className="btn ghost sm" disabled={step === 0} onClick={() => { setStep(step - 1); toTop(); }}>← Vorige</button>
                    <div className="dots">{BRIEF.haltes.map((h, i) => (<span key={i} className={`dot ${i === step ? "active" : done[h.key] ? "done" : ""}`} />))}</div>
                    <button className="btn sm" onClick={() => { markDone(halte.key); setStep(step + 1); toTop(); }}>{step === BRIEF.haltes.length - 1 ? "Afronden" : "Volgende →"}</button>
                  </div>
                </>
              )}
              {atEnd && (
                <div className="done-screen r r1">
                  <div className="seal">✦</div>
                  <h2>Je hebt de Romeinenbrief doorlopen</h2>
                  <p>Van de diepte van de zonde tot de hoogte van de genade. Soli Deo Gloria. Je notities blijven bewaard.</p>
                  <div style={{ display:"flex", gap:10, justifyContent:"center", marginTop:22, flexWrap:"wrap" }}>
                    <button className="btn ghost sm" onClick={() => { setStep(0); toTop(); }}>Opnieuw lezen</button>
                    <button className="btn sm" onClick={() => { setReading(false); toTop(); }}>Naar de inhoud →</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {tab === "notities" && !reading && (
            <div className="r r1">
              <div className="hero-sub" style={{ marginTop:8 }}>{noteList.length > 0 ? `${noteList.length} bewaarde notitie${noteList.length > 1 ? "s" : ""}` : ""}</div>
              {noteList.length === 0 ? (
                <div className="empty">Nog geen notities.<br />Bij elk hoofdstuk kun je een gedachte opschrijven. Die verschijnt hier.</div>
              ) : (
                <div className="cardlist">
                  {noteList.map((n) => (
                    <div key={n.key} className="note-item" onClick={() => openRead(n.hfdst - 1)}>
                      <div className="ni-ref">{n.ref}</div>
                      <div className="ni-q">{n.vraag}</div>
                      <div className="ni-text">{n.text}</div>
                    </div>
                  ))}
                </div>
              )}
              <div className="foot"><div className="vref">Onderweg met Paulus</div></div>
            </div>
          )}

          </>}

        </div>
      </div>

      {!reading && !chapterOpen && (
        <nav className="tabbar">
          {[{ id: "vandaag", label: "Vandaag" }, { id: "brief", label: "De brief" }, { id: "notities", label: "Notities" }].map((t) => (
            <button key={t.id} className={`tabbtn ${tab === t.id ? "active" : ""}`} onClick={() => { setTab(t.id); toTop(); }}>
              <Icon name={t.id === "brief" ? "brief" : t.id} /><span className="tl">{t.label}</span>
            </button>
          ))}
        </nav>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
    }
  </script>
</body>
</html>
